name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Capacitor APK
        run: |
          set -eux
          # Ensure SDK path is visible to Gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties || true

          npm install
          # CLI is a devDependency
          npx cap add android || true
          npx cap sync android

          # Write sdk.dir into the android project too
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          APK=$(find . -path "*outputs*debug*.apk" -o -path "*/outputs/apk/debug/*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" 2>/dev/null | head -1)
          fi
          echo "APK=$APK"
          test -n "$APK" || { echo "No APK found"; find . -name "*.apk" -o -path "*outputs*" 2>/dev/null | head -40; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/app.apk"
          ls -la "$GITHUB_WORKSPACE/app.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app.apk
